repository:
  # See https://docs.github.com/en/rest/reference/repos#update-a-repository for all available settings.

  # The name of the repository. Changing this will rename the repository
  name: gke-wireguard-pihole-stack

  # A short description of the repository that will show up on GitHub
  description: "A complete stack for running WireGuard and Pi-hole on Google Kubernetes Engine (GKE) using Terraform."

  # A URL with more information about the repository
  homepage: https://github.com/idvoretskyi/gke-wireguard-pihole-stack

  # A list of topics to set on the repository
  topics:
    - terraform
    - gke
    - wireguard
    - pihole
    - kubernetes
    - vpn
    - privacy

  # Component to check to enable the issues feature.
  has_issues: true

  # Component to check to enable the projects feature.
  has_projects: false

  # Component to check to enable the wiki feature.
  has_wiki: false

  # Component to check to enable the downloads feature.
  has_downloads: true

  # Set to true to enable the "Allow merge commits" option.
  allow_merge_commit: true

  # Set to true to enable the "Allow squash merging" option.
  allow_squash_merge: true

  # Set to true to enable the "Allow rebase merging" option.
  allow_rebase_merge: true

  # Set to true to enable the "Delete branch after merge" option.
  delete_branch_on_merge: true
